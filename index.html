<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1715">
  <title>電波人間 顔シミュレーター</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">DENPA FACE MAKER</p>
      <h1>顔シミュレーター</h1>
    </div>
    <p class="header-note">パーツと色を選んで、顔をつくろう。</p>
  </header>

  <main class="app-shell">
    <section class="preview-panel" aria-labelledby="preview-title">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">PREVIEW</p>
          <h2 id="preview-title">プレビュー</h2>
        </div>
        <span id="render-status" class="status-pill" aria-live="polite">準備中</span>
      </div>

      <div class="canvas-frame">
        <canvas id="face-canvas" width="1024" height="1024" aria-label="作成中の顔のプレビュー"></canvas>
        <div id="loading-cover" class="loading-cover">
          <span class="spinner" aria-hidden="true"></span>
          <span>素材を読み込んでいます</span>
        </div>
      </div>

      <div class="preview-actions">
        <label class="field compact-field" for="export-background">
          <span>保存する背景</span>
          <select id="export-background">
            <option value="color">現在の背景色</option>
            <option value="transparent">透明</option>
          </select>
        </label>
        <button id="download-button" class="button button-primary" type="button">
          <span aria-hidden="true">↓</span> PNG保存
        </button>
        <button id="reset-button" class="button button-secondary" type="button">設定リセット</button>
      </div>
      <p class="canvas-note">保存サイズ 1024 × 1024 px</p>
    </section>

    <section class="controls-panel" aria-labelledby="controls-title">
      <div class="panel-heading controls-heading">
        <div>
          <p class="section-kicker">CUSTOMIZE</p>
          <h2 id="controls-title">カスタマイズ</h2>
        </div>
        <button id="collapse-button" class="text-button" type="button">すべて閉じる</button>
      </div>

      <div id="controls" class="controls" aria-busy="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>画像はブラウザ内で合成され、外部へ送信されません。</p>
  </footer>

  <noscript>このシミュレーターを使用するにはJavaScriptを有効にしてください。</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
